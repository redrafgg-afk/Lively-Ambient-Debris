; ============================================================================
; Lively Ambient Debris - Configuration File
; ============================================================================

[General]
; Maximum active debris particles around the player (16 - 1500)
InstanceCount=850
; Automatically scales particle quota when frame time spikes (1 = Enabled, 0 = Disabled)
DynamicQuotaScaling=1
; Maximum height (in meters) above ground where canopy leaves spawn and drift down
SpawnHeight=15.0
; Horizontal radius (in meters) around the player where debris spawns and recycles
PositionRange=32.0
; Minimum and maximum base particle scale
ScaleMin=0.065
ScaleMax=0.125
; Ratio of debris grouped in natural clusters vs. scattered evenly (0.0 - 1.0)
ClumpRatio=0.65
; Radius (in meters) of each debris cluster
ClumpRadius=3.8
; Maximum render distance (in meters) from the camera
DrawDistance=46.0
; Extra outer buffer (in meters) beyond PositionRange before debris fades out and recycles
SpawnBufferDistance=8.0
; Minimum horizontal distance (in meters) from the camera so debris never spawns right in front of the lens
MinCameraSpawnDist=6.5
; Smooth fade-in and fade-out durations (in seconds) when spawning and despawning
FadeInDuration=0.75
FadeOutDuration=0.65
; Place ground debris directly onto surfaces at startup (1 = Yes, 0 = Drop from air)
SnapToGroundOnStart=1

[LeafDistribution]
; Split percentage between elevated canopy-drifting leaves and ground-level debris.
; Values are automatically normalized if their sum is not 100.
; CanopyLeafPercentage: Leaves spawning high in the air (4.5m to SpawnHeight) and drifting down.
CanopyLeafPercentage=12.0
; GroundLeafPercentage: Leaves and debris spawning near or resting on the ground surface.
GroundLeafPercentage=88.0

; ============================================================================
; Debris Spawn Percentages by Location (0.0 - 100.0)
; Each category is automatically normalized to 100%, so you can freely adjust
; any value or set unwanted debris types to 0.0.
